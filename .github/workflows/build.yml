name: Build L4D2 Native Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permissions for Gradle
        run: chmod +x gradlew || true

      - name: Build Android Release APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease
          else
            echo "Gradle wrapper not found, running cmake build directly..."
            cmake -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a
            cmake --build build
          fi
        shell: bash

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: L4D2-Mobile-APK
          path: |
            app/build/outputs/apk/release/*.apk
            build/*.apk
            build/*.so
